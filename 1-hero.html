<div class="pxc-hero-block">
  <style>
    .pxc-hero-block {
      --pxc-sky: #6ac9c9;
      --pxc-wheat: #ecead8;
      --pxc-navy: #145f76;
      font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      border-radius: 14px;
      overflow: hidden;
      box-sizing: border-box;
      max-width: 1040px;
      margin: 0 auto;
    }
    .pxc-hero-block *, .pxc-hero-block *::before, .pxc-hero-block *::after { box-sizing: border-box; }
    .pxc-hero-block h1 { font-family: 'Fira Sans Condensed', 'Arial Narrow', sans-serif; margin: 0; letter-spacing: 0.01em; }
    .pxc-hero {
      position: relative;
      background: var(--pxc-navy);
      color: #fff;
      padding: 40px 40px 34px;
      overflow: hidden;
    }
    .pxc-hero-logo { position: absolute; top: -70px; right: -60px; width: 260px; height: 260px; opacity: 0.9; }
    .pxc-hero h1 { font-size: 36px; font-weight: 700; line-height: 1.08; max-width: 560px; position: relative; color: #fff; }
    .pxc-hero p {
      font-family: 'Work Sans', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      max-width: 480px;
      margin: 12px 0 20px;
      color: #fff;
      position: relative;
    }
    .pxc-hero-actions { display: flex; gap: 12px; flex-wrap: wrap; position: relative; }
    .pxc-btn-primary {
      font-family: 'Fira Sans Condensed', sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.03em;
      text-decoration: none;
      background: var(--pxc-sky);
      color: #000;
      padding: 11px 20px;
      border-radius: 8px;
      transition: transform 0.15s ease, background 0.15s ease;
      display: inline-block;
    }
    .pxc-btn-primary:hover { background: #7fd3d3; transform: translateY(-1px); }
    .pxc-btn-secondary {
      font-family: 'Fira Sans Condensed', sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.03em;
      text-decoration: none;
      background: transparent;
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.4);
      padding: 10px 18px;
      border-radius: 8px;
      transition: border-color 0.15s ease, background 0.15s ease;
      display: inline-block;
    }
    .pxc-btn-secondary:hover { border-color: var(--pxc-sky); background: rgba(106,201,201,0.08); }
    @media (max-width: 760px) {
      .pxc-hero { padding: 30px 22px 26px; }
      .pxc-hero h1 { font-size: 27px; }
    }
  </style>
