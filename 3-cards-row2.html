<div class="pxc-grid-block">
  <style>
    .pxc-grid-block {
      --pxc-sky: #6ac9c9;
      --pxc-wheat: #ecead8;
      --pxc-navy: #145f76;
      --pxc-sky-tint: rgba(106, 201, 201, 0.14);
      font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--pxc-wheat);
      border-radius: 14px;
      box-sizing: border-box;
      max-width: 1040px;
      margin: 0 auto;
    }
    .pxc-grid-block *, .pxc-grid-block *::before, .pxc-grid-block *::after { box-sizing: border-box; }
    .pxc-grid-block h3 { font-family: 'Fira Sans Condensed', 'Arial Narrow', sans-serif; margin: 0; letter-spacing: 0.01em; }
    .pxc-section-label {
      font-family: 'Fira Sans Condensed', sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #000;
      opacity: 0.65;
      padding: 14px 20px 8px;
    }
    .pxc-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 20px 14px;
    }
    .pxc-card {
      position: relative;
      background: #fff;
      border: 1px solid rgba(20, 95, 118, 0.1);
      border-radius: 10px;
      padding: 12px 14px 11px;
      text-decoration: none;
      color: #000;
      overflow: hidden;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      display: block;
    }
    .pxc-card:hover { border-color: var(--pxc-sky); box-shadow: 0 6px 18px rgba(20, 95, 118, 0.1); }
    .pxc-card-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--pxc-sky-tint);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
      font-family: 'Fira Sans Condensed', sans-serif;
      font-weight: 700;
      font-size: 13px;
      color: #000;
    }
    .pxc-card h3 { font-size: 16.5px; font-weight: 700; color: #000; margin-bottom: 3px; }
    .pxc-card p { font-family: 'Work Sans', sans-serif; font-size: 12.5px; line-height: 1.4; color: #000; margin: 0; }
    @media (max-width: 700px) {
      .pxc-grid { grid-template-columns: 1fr; }
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@600;700&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">

    <a class="pxc-card" href="#">
      <div class="pxc-card-icon">N</div>
      <h3>Networks</h3>
      <p>WIN, YIN, and PLN resources, channels, and network news.</p>
    </a>
    <a class="pxc-card" href="#">
      <div class="pxc-card-icon">C</div>
      <h3>Convenings and events</h3>
      <p>Details and resources for the PLACE Impact Summit and other convenings.</p>
    </a>
    <a class="pxc-card" href="#">
      <div class="pxc-card-icon">?</div>
      <h3>Need a hand?</h3>
      <p>New to PLACExCHANGE? Get oriented with a short platform walkthrough.</p>
    </a>
  </div>
</div>
